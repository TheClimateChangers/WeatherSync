name: Manual Deploy (No Tests)

# This workflow is for manual deployment without running tests
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'mark-dev'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch }}
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
        
    - name: Set known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ec2-user
        TARGET_BRANCH: ${{ github.event.inputs.branch }}
      run: |
        # Create deployment script
        cat > deploy.sh << EOL
        #!/bin/bash
        set -e

        echo "Updating code repository..."
        cd ~/WeatherSync
        git fetch --all
        git reset --hard origin/${TARGET_BRANCH}

        echo "Setting up backend..."
        cd ~/WeatherSync/backend
        source env/bin/activate || python -m venv env && source env/bin/activate
        pip install -r requirements.txt
        
        # Create static root directory if needed
        mkdir -p ~/WeatherSync/backend/staticfiles
        
        # Check if STATIC_ROOT is set, if not create a settings override
        if ! grep -q "STATIC_ROOT" backend/settings.py; then
          # Create or update local_settings.py with STATIC_ROOT
          echo "# Local settings" > backend/local_settings.py
          echo "import os" >> backend/local_settings.py
          echo "from pathlib import Path" >> backend/local_settings.py
          echo "" >> backend/local_settings.py
          echo "BASE_DIR = Path(__file__).resolve().parent.parent" >> backend/local_settings.py
          echo "STATIC_ROOT = os.path.join(BASE_DIR, 'staticfiles')" >> backend/local_settings.py
          
          # Check if settings.py imports local_settings
          if ! grep -q "local_settings" backend/settings.py; then
            echo "" >> backend/settings.py
            echo "# Import local settings" >> backend/settings.py
            echo "try:" >> backend/settings.py
            echo "    from .local_settings import *" >> backend/settings.py
            echo "except ImportError:" >> backend/settings.py
            echo "    pass" >> backend/settings.py
          fi
        fi
        
        python manage.py migrate
        python manage.py collectstatic --noinput

        echo "Setting up frontend..."
        cd ~/WeatherSync/frontend
        npm ci
        npm run build

        echo "Configuring Nginx (if not already done)..."
        if [ ! -f /etc/nginx/sites-available/weathersync ]; then
          sudo tee /etc/nginx/sites-available/weathersync > /dev/null << EOF
        server {
            listen 80;
            server_name _;
            
            location /api {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
            }
            
            location /admin {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
            }
            
            location /static {
                alias /home/ec2-user/WeatherSync/backend/staticfiles;
            }
            
            location / {
                root /home/ec2-user/WeatherSync/frontend/dist;
                try_files \$uri \$uri/ /index.html;
            }
        }
        EOF
          sudo ln -sf /etc/nginx/sites-available/weathersync /etc/nginx/sites-enabled/
          sudo nginx -t && sudo systemctl restart nginx
        fi

        echo "Configuring Gunicorn service..."
        sudo tee /etc/systemd/system/weathersync.service > /dev/null << EOF
        [Unit]
        Description=WeatherSync Gunicorn daemon
        After=network.target

        [Service]
        User=ec2-user
        Group=ec2-user
        WorkingDirectory=/home/ec2-user/WeatherSync/backend
        ExecStart=/home/ec2-user/WeatherSync/backend/env/bin/gunicorn --workers 3 --bind 127.0.0.1:8000 backend.wsgi:application
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
        EOF

        # Install gunicorn if not already installed
        cd ~/WeatherSync/backend
        source env/bin/activate
        pip install gunicorn

        echo "Restarting services..."
        sudo systemctl daemon-reload
        sudo systemctl restart weathersync
        sudo systemctl enable weathersync
        sudo systemctl restart nginx

        echo "Deployment completed!"
        EOL
        
        # Copy and execute deployment script on EC2
        chmod +x deploy.sh
        scp deploy.sh ${EC2_USER}@${EC2_HOST}:~/deploy.sh
        ssh ${EC2_USER}@${EC2_HOST} "chmod +x ~/deploy.sh && ~/deploy.sh" 