name: WeatherSync CI/CD Pipeline

on:
  push:
    branches: [ "main", "mark-dev" ]
  pull_request:
    branches: [ "main", "mark-dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        
    - name: Run backend tests
      run: |
        cd backend
        python manage.py test
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint || true
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
        
    - name: Set known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
        
    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ec2-user
      run: |
        # Create deployment script
        cat > deploy.sh << 'EOL'
        #!/bin/bash
        set -e

        echo "Updating code repository..."
        cd ~/WeatherSync
        git fetch --all
        git reset --hard origin/mark-dev

        echo "Setting up backend..."
        cd ~/WeatherSync/backend
        source env/bin/activate || python -m venv env && source env/bin/activate
        pip install -r requirements.txt
        python manage.py migrate
        python manage.py collectstatic --noinput

        echo "Setting up frontend..."
        cd ~/WeatherSync/frontend
        npm ci
        npm run build

        echo "Configuring Nginx (if not already done)..."
        if [ ! -f /etc/nginx/sites-available/weathersync ]; then
          sudo tee /etc/nginx/sites-available/weathersync > /dev/null << EOF
        server {
            listen 80;
            server_name _;
            
            location /api {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
            }
            
            location /admin {
                proxy_pass http://127.0.0.1:8000;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
            }
            
            location /static {
                alias /home/ec2-user/WeatherSync/backend/static;
            }
            
            location / {
                root /home/ec2-user/WeatherSync/frontend/dist;
                try_files \$uri \$uri/ /index.html;
            }
        }
        EOF
          sudo ln -sf /etc/nginx/sites-available/weathersync /etc/nginx/sites-enabled/
          sudo nginx -t && sudo systemctl restart nginx
        fi

        echo "Configuring Gunicorn service..."
        sudo tee /etc/systemd/system/weathersync.service > /dev/null << EOF
        [Unit]
        Description=WeatherSync Gunicorn daemon
        After=network.target

        [Service]
        User=ec2-user
        Group=ec2-user
        WorkingDirectory=/home/ec2-user/WeatherSync/backend
        ExecStart=/home/ec2-user/WeatherSync/backend/env/bin/gunicorn --workers 3 --bind 127.0.0.1:8000 backend.wsgi:application
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target
        EOF

        # Install gunicorn if not already installed
        cd ~/WeatherSync/backend
        source env/bin/activate
        pip install gunicorn

        echo "Restarting services..."
        sudo systemctl daemon-reload
        sudo systemctl restart weathersync
        sudo systemctl enable weathersync
        sudo systemctl restart nginx

        echo "Deployment completed!"
        EOL
        
        # Copy and execute deployment script on EC2
        chmod +x deploy.sh
        scp deploy.sh ${EC2_USER}@${EC2_HOST}:~/deploy.sh
        ssh ${EC2_USER}@${EC2_HOST} "chmod +x ~/deploy.sh && ~/deploy.sh"
