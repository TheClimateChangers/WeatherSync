#!/bin/bash
set -e

echo "Updating code repository..."
cd ~/WeatherSync
git fetch --all
git reset --hard origin/mark-dev

echo "Setting up backend..."
cd ~/WeatherSync/backend
source env/bin/activate || python -m venv env && source env/bin/activate
pip install -r requirements.txt

# Create static root directory if needed
mkdir -p ~/WeatherSync/backend/staticfiles

# Create or update local settings
echo "# Local settings" > backend/local_settings.py
echo "import os" >> backend/local_settings.py
echo "from pathlib import Path" >> backend/local_settings.py
echo "BASE_DIR = Path(__file__).resolve().parent.parent" >> backend/local_settings.py
echo "STATIC_ROOT = os.path.join(BASE_DIR, 'staticfiles')" >> backend/local_settings.py
echo "ALLOWED_HOSTS = ['*']" >> backend/local_settings.py

# Ensure settings.py imports local_settings
if ! grep -q "local_settings" backend/settings.py; then
  echo "" >> backend/settings.py
  echo "# Import local settings" >> backend/settings.py
  echo "try:" >> backend/settings.py
  echo "    from .local_settings import *" >> backend/settings.py
  echo "except ImportError:" >> backend/settings.py
  echo "    pass" >> backend/settings.py
fi

python manage.py migrate
python manage.py collectstatic --noinput

echo "Setting up frontend..."
cd ~/WeatherSync/frontend
npm ci
npm run build

# Install serve if not already
npm install -g serve

echo "Starting frontend on port 5173..."
# Kill existing serve process if any
fuser -k 5173/tcp || true
nohup serve -s dist -l 5173 > ~/serve.log 2>&1 &

echo "Configuring Gunicorn for backend on port 8080..."
sudo tee /etc/systemd/system/weathersync.service > /dev/null << EOF
[Unit]
Description=WeatherSync Gunicorn daemon
After=network.target

[Service]
User=ec2-user
Group=ec2-user
WorkingDirectory=/home/ec2-user/WeatherSync/backend
ExecStart=/home/ec2-user/WeatherSync/backend/env/bin/gunicorn --workers 3 --bind 127.0.0.1:8080 backend.wsgi:application
Restart=on-failure

[Install]
WantedBy=multi-user.target
EOF

pip install gunicorn

echo "Restarting backend service..."
sudo systemctl daemon-reload
sudo systemctl restart weathersync
sudo systemctl enable weathersync

echo "Configuring Nginx for proxying..."
sudo tee /etc/nginx/sites-available/weathersync > /dev/null << EOF
server {
    listen 80;
    server_name traveltripsync.com;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host \$host;
        proxy_cache_bypass \$http_upgrade;
    }
}
EOF

sudo ln -sf /etc/nginx/sites-available/weathersync /etc/nginx/sites-enabled/
sudo nginx -t && sudo systemctl restart nginx

echo "Deployment completed!"
